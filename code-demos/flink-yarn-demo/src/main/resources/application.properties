# ==============================================================================
# Flink Realtime Order Risk Job Configuration
# ==============================================================================

# Kafka 集群配置 (当替换为真实 KafkaSource 时使用)
kafka.bootstrap.servers=kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092
kafka.topic.input=realtime.orders.raw
kafka.group.id=flink-order-risk-consumer-group

# 窗口与时间语义参数
window.size.minutes=1
window.allowed.lateness.seconds=5
watermark.out.of.orderness.seconds=3

# Checkpoint 存储路径
state.checkpoints.dir=hdfs:///flink/checkpoints/order_risk
state.savepoints.dir=hdfs:///flink/savepoints/order_risk
